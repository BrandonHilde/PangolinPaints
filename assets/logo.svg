<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pangolin Paints: a pangolin whose tail is a paint-dipped brush, laying down the stroke it walks on -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#2c2621"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <!-- the brushstroke -->
  <path d="M8 53.5C20 50.5 34 55.5 47 52.5" fill="none" stroke="#e2553f" stroke-width="3.5" stroke-linecap="round"/>
  <!-- legs -->
  <rect x="19.5" y="40" width="5.5" height="10" rx="2.75" fill="#6e4126"/>
  <rect x="35" y="39" width="7" height="11" rx="3.5" fill="#6e4126"/>
  <!-- body and tail in one arch, the tail running down to the ground -->
  <path d="M17 45C15 35 21 23.5 32 21.5S51 22 55.5 31c3 6 3 12 .3 16.8l-4.8-.6c1.2-4.2.6-8.2-2.8-10.2C46 40.5 43 45 37 45Z" fill="#d08c4e"/>
  <!-- scales, row by row from the ridge of the back -->
  <g fill="none" stroke="#8a532c" stroke-width="2" stroke-linecap="round">
    <path d="M27 27a2.75 2.75 0 0 0 5.5 0a2.75 2.75 0 0 0 5.5 0a2.75 2.75 0 0 0 5.5 0"/>
    <path d="M22 33a2.75 2.75 0 0 0 5.5 0a2.75 2.75 0 0 0 5.5 0a2.75 2.75 0 0 0 5.5 0a2.75 2.75 0 0 0 5.5 0"/>
    <path d="M23.5 39a2.75 2.75 0 0 0 5.5 0a2.75 2.75 0 0 0 5.5 0"/>
    <path d="M47.8 27.8a2.75 2.75 0 0 0 .8 5.4"/>
    <path d="M52.8 33a2.75 2.75 0 0 0 .2 5.5"/>
    <path d="M55.6 39.6a2.5 2.5 0 0 0-.4 5"/>
  </g>
  <!-- tail tip: ferrule and a wet red tuft -->
  <path d="M51 48.2 55.8 48.8" stroke="#e9d3a6" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M50.6 50.3h5c.2 3.2-1.8 5.6-5.6 6.3-.4-2.3-.2-4.3.6-6.3Z" fill="#e2553f"/>
  <!-- head, low and pointed -->
  <path d="M22.5 32C18 32 14 34.5 10.8 38.4 9 40.6 7.2 42.4 4.8 43.8 9 45.4 15.5 45.8 22 45.2c-2-4-1.8-9.2.5-13.2Z" fill="#efcb98"/>
  <circle cx="14.6" cy="38.1" r="1.6" fill="#2a1c14"/>
  <circle cx="5.3" cy="43.7" r="1.3" fill="#6e4126"/>
</svg>
